 <country-search-input placeholder="Search by country"
  (value)="query.set($event)" [debounceTime]="500" [initialValue]="query()" />

 <country-list
  [countries]="capitalResource.value() ?? []"
  [errorMessage]="errorMessage()"
  [isEmpty]="capitalResource.value()?.length === 0"
  [isLoading]="capitalResource.isLoading()"
/>
